<!-- ── Single desk (wall/counter seat — no table surface) ──────────────── -->
<ng-container *ngIf="variant === 'single'">
  <button
    class="seat seat--single"
    [class.seat--available]="table.seats[0].status === 'available'"
    [class.seat--reserved]="table.seats[0].status === 'reserved'"
    [class.seat--selected]="table.seats[0].status === 'selected'"
    [disabled]="table.seats[0].status === 'reserved'"
    [attr.aria-label]="'Koltuk ' + table.seats[0].label"
    (click)="onSeatClick(table.seats[0])"
  >
    <i *ngIf="table.seats[0].status === 'reserved'" class="bi bi-lock-fill seat-lock"></i>
    <span *ngIf="table.seats[0].status !== 'reserved'" class="seat-num">{{ getSeatNumber(table.seats[0].label) }}</span>
  </button>
</ng-container>

<!-- ── Standard (2+2) or Wide (5+5) table ─────────────────────────────── -->
<div
  *ngIf="variant !== 'single'"
  class="table-card"
  [class.table-card--wide]="variant === 'wide'"
  [class.table-card--has-selected]="hasSelectedSeat"
  [class.table-card--full]="fullyReserved"
  [attr.aria-label]="'Masa ' + (table.label ?? table.id)"
>
  <!-- Label badge -->
  <div class="table-label-badge">Masa {{ table.label ?? ('M' + table.id) }}</div>

  <!-- Top seats row -->
  <div class="seat-row seat-row--top">
    <button
      *ngFor="let seat of topSeats"
      class="seat seat--top"
      [class.seat--available]="seat.status === 'available'"
      [class.seat--reserved]="seat.status === 'reserved'"
      [class.seat--selected]="seat.status === 'selected'"
      [disabled]="seat.status === 'reserved'"
      [attr.aria-label]="seat.label"
      (click)="onSeatClick(seat)"
    >
      <i *ngIf="seat.status === 'reserved'" class="bi bi-lock-fill seat-lock"></i>
      <span *ngIf="seat.status !== 'reserved'" class="seat-num">{{ getSeatNumber(seat.label) }}</span>
    </button>
  </div>

  <!-- Bottom seats row -->
  <div class="seat-row seat-row--bottom">
    <button
      *ngFor="let seat of bottomSeats"
      class="seat seat--bottom"
      [class.seat--available]="seat.status === 'available'"
      [class.seat--reserved]="seat.status === 'reserved'"
      [class.seat--selected]="seat.status === 'selected'"
      [disabled]="seat.status === 'reserved'"
      [attr.aria-label]="seat.label"
      (click)="onSeatClick(seat)"
    >
      <i *ngIf="seat.status === 'reserved'" class="bi bi-lock-fill seat-lock"></i>
      <span *ngIf="seat.status !== 'reserved'" class="seat-num">{{ getSeatNumber(seat.label) }}</span>
    </button>
  </div>
</div>
